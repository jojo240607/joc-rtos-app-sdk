# joc-rtos-app-sdk workspace：RTOS 应用层 SDK（中间工程）+ 示例应用。
# 任何 Rust 应用只需依赖 `sdk`（rtos-app-sdk）并实现 `app_main()`，
# 即可作为独立 App 分区（轨 B 双分区）跑在 joc-base 的 jOS RTOS 上。
[workspace]
resolver = "2"
members = ["sdk", "apps/demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["joc"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"      # 尺寸优先（APP_FLASH 384KB / APP_RAM 111KB 预算）
lto = true
codegen-units = 1
panic = "abort"      # 无 unwind；panic! -> UDF -> 内核 fault handler
debug = false
